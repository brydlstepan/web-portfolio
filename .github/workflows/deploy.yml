name: Deploy

# Dev  → dev.brydlstepan.cz (Cloudflare Pages preview branch "Dev")
# main → brydlstepan.cz     (Cloudflare Pages production)
# Runs only when a pushed commit contains "[build]" (or when started manually).
# The built site (dist/) is uploaded to Cloudflare and never committed.

on:
  push:
    branches: [Dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits.*.message), '[build]')
    runs-on: ubuntu-latest
    environment: web-portfolio
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        env:
          SITE_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          # Only their hashes reach the deployed password gate (functions/_middleware.js).
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node tools/build.js

      - name: Check that secrets are configured
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Missing:$missing — skipping deploy (see README → Deployment)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # First run only: create the Direct Upload project (fails harmlessly if it exists).
          npx --yes wrangler@4 pages project create web-portfolio --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=web-portfolio --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
